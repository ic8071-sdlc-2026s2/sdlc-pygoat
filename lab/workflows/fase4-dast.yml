# Fase 4: copie este archivo a .github/workflows/fase4-dast.yml y complete los TODO.
# Levanta la app en el runner, la ataca con ZAP y corre las pruebas escritas desde
# los casos de abuso. Solo reporta: las pruebas en rojo son lo esperado hasta corregir.
name: Fase 4 · DAST y pruebas de abuso

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Construir la imagen de la app
        uses: docker/build-push-action@v7
        with:
          context: app
          load: true
          tags: lab-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Levantar la app
        run: bash lab/app.sh iniciar lab-app:ci

      - name: Escaneo dinámico con ZAP
        run: |
          mkdir -p reportes && chmod 777 reportes
          source lab/app.env
          echo "Objetivo: http://localhost:$APP_PUERTO (modo $ZAP_MODO)"
          # TODO: ejecute ZAP con la imagen ghcr.io/zaproxy/zaproxy:stable.
          #   Modo baseline: zap-baseline.py -t http://localhost:$APP_PUERTO
          #   Modo api:      zap-api-scan.py -t http://localhost:$APP_PUERTO$ZAP_OPENAPI -f openapi
          #                  -O http://localhost:$APP_PUERTO   (si la especificación no declara servers)
          #   Modo graphql:  zap-api-scan.py -t http://localhost:$APP_PUERTO$ZAP_GRAPHQL -f graphql
          # Use --network host, monte reportes/ en /zap/wrk, genere zap.html y zap.json
          # y agregue -I para que las alertas no detengan el job.

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pruebas de abuso (rojo esperado hasta corregir)
        continue-on-error: true
        run: |
          pip install -r seguridad/fase-4/pruebas/requirements.txt
          source lab/app.env
          APP_URL="http://localhost:$APP_PUERTO" pytest seguridad/fase-4/pruebas -v \
            --junitxml=reportes/pytest.xml

      - name: Bitácora de la app
        if: always()
        run: bash lab/app.sh logs > reportes/app.log 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reporte-dast
          path: reportes/
